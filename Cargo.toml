[package]
name = "opus-sm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
anyhow = "1.0.102"
audiopus_sys = { version = "0.2.2", features = ["static"] }
arrow-array = "58.1.0"
arrow-schema = "58.1.0"
arrow-select = "58.1.0"
clap = { version = "4.6.0", features = ["derive"] }
env_logger = "0.11.10"
hound = "3.5.1"
log = "0.4.29"
ogg = "0.9.2"
opus = "0.3.1"
parquet = "58.1.0"
pyo3 = { version = "0.27", optional = true, features = ["extension-module"] }
rayon = "1.11.0"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }

[build-dependencies]
cc = "1.2.41"

[profile.release]
codegen-units = 1
lto = true
strip = true
